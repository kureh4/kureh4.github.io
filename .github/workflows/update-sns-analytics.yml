name: Update SNS analytics
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sns-analytics-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
      - run: pip install google-analytics-data
      - name: Fetch GA4 events
        env:
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
        run: python scripts/fetch_ga4.py
      - name: Publish updated counts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/data.json
          if ! git diff --cached --quiet; then
            git commit -m "Update SNS analytics data"
            git push
          fi
