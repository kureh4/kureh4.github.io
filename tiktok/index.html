<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>tiktokへ移動中</title>
<script>
const destination="https://www.tiktok.com/@_kurehq_harem_next";
const measurementId="G-XXXXXXXXXX"; // GA4の測定IDに変更
if (/^G-[A-Z0-9]+$/.test(measurementId) && measurementId!=="G-XXXXXXXXXX") {
 const s=document.createElement("script");s.async=true;s.src="https://www.googletagmanager.com/gtag/js?id="+encodeURIComponent(measurementId);document.head.appendChild(s);
 window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}
 gtag("js",new Date());gtag("config",measurementId,{send_page_view:false});
 gtag("event","sns_redirect",{sns:"tiktok",transport_type:"beacon",event_callback:go,event_timeout:1200});
 setTimeout(go,1500);
} else {setTimeout(go,150);}
let redirected=false;
function go(){if(redirected)return;redirected=true;location.replace(destination);}
</script></head><body><p>tiktokへ移動しています。<a href="https://www.tiktok.com/@_kurehq_harem_next">移動しない場合はこちら</a></p></body></html>
