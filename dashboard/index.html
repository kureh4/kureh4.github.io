<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f7fb"><title>SNS Analytics | kureh4</title><style>
:root{font-family:system-ui,-apple-system,"Helvetica Neue",sans-serif;color:#192034;background:#f6f7fb}*{box-sizing:border-box}body{margin:0}main{max-width:1150px;margin:auto;padding:28px 18px 70px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:25px}h1{font-size:clamp(23px,4vw,34px);letter-spacing:-.04em;margin:0}h2{font-size:18px;margin:0 0 15px}.muted{color:#788195;font-size:13px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.card{background:#fff;border:1px solid #e9ecf2;border-radius:22px;padding:22px;box-shadow:0 8px 30px #1a2c4808}.metric{font-size:clamp(30px,4.4vw,48px);font-weight:800;letter-spacing:-.05em;margin-top:13px}.label{font-weight:700;display:flex;align-items:center;gap:9px}.dot{width:11px;height:11px;border-radius:50%;display:inline-block}.ig{background:#e83c91}.tt{background:#14bdc6}.total{background:#6877f5}.panel{margin-top:16px}.chartbox{height:330px;position:relative}canvas{width:100%;height:100%}.legend{display:flex;gap:18px;flex-wrap:wrap}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button{border:1px solid #e3e7ee;background:#fff;color:#344056;padding:10px 14px;border-radius:12px;font-weight:650;cursor:pointer}button.active{background:#26345a;color:white;border-color:#26345a}.status{margin:18px 0;color:#626f85;font-size:13px}.error{color:#c44444}.foot{font-size:12px;color:#7a8497;margin-top:20px}a{color:#4b62ca}@media(max-width:700px){main{padding:22px 13px 50px}.cards{grid-template-columns:1fr 1fr;gap:10px}.cards .card:first-child{grid-column:1/-1}.card{padding:17px;border-radius:17px}.metric{font-size:35px}.chartbox{height:270px}.head{align-items:flex-start}.panel{margin-top:12px}}</style></head><body><main>
<header class="head"><div><div class="muted">kureh4 / Analytics</div><h1>SNSリンクのアクセス数</h1></div><div class="tools" role="group" aria-label="表示期間"><button data-days="7">7日</button><button data-days="30" class="active">30日</button><button data-days="90">90日</button></div></header>
<section class="cards" aria-label="集計"><div class="card"><div class="label"><span class="dot total"></span>合計クリック</div><div class="metric" id="total">—</div><div class="muted" id="period">直近30日</div></div><div class="card"><div class="label"><span class="dot ig"></span>Instagram</div><div class="metric" id="instagram">—</div><div class="muted" id="igShare">—</div></div><div class="card"><div class="label"><span class="dot tt"></span>TikTok</div><div class="metric" id="tiktok">—</div><div class="muted" id="ttShare">—</div></div></section>
<section class="card panel"><div class="head"><div><h2>クリック数の推移</h2><div class="muted">日別の計測イベント数</div></div><div class="legend"><span><i class="dot ig"></i> Instagram</span><span><i class="dot tt"></i> TikTok</span></div></div><div class="chartbox"><canvas id="chart" role="img" aria-label="日別クリック数の折れ線グラフ"></canvas></div></section>
<div id="status" class="status" aria-live="polite">データを読み込み中…</div><div class="foot">GA4で計測できた転送イベント数です。広告ブロックなどで計測漏れが生じる場合があります。集計データは公開されます。<br><a href="/instagram/">Instagramリンク</a> · <a href="/tiktok/">TikTokリンク</a></div></main>
<script>
let records=[],selected=30;const $=id=>document.getElementById(id),fmt=n=>n.toLocaleString('ja-JP');function render(){const data=records.slice(-selected),ig=data.reduce((s,r)=>s+(r.instagram||0),0),tt=data.reduce((s,r)=>s+(r.tiktok||0),0),total=ig+tt;$('total').textContent=fmt(total);$('instagram').textContent=fmt(ig);$('tiktok').textContent=fmt(tt);$('period').textContent='直近'+selected+'日';$('igShare').textContent=total?Math.round(ig/total*100)+'%':'0%';$('ttShare').textContent=total?Math.round(tt/total*100)+'%':'0%';draw(data)}function draw(data){const c=$('chart'),box=c.parentElement,w=box.clientWidth,h=box.clientHeight,dpr=devicePixelRatio||1;c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);const ctx=c.getContext('2d');ctx.scale(dpr,dpr);ctx.clearRect(0,0,w,h);const left=42,right=12,top=15,bottom=35,cw=w-left-right,ch=h-top-bottom,max=Math.max(4,...data.flatMap(x=>[x.instagram||0,x.tiktok||0]));ctx.font='12px system-ui';ctx.textAlign='right';for(let i=0;i<=4;i++){const y=top+ch*i/4;ctx.strokeStyle='#e9edf4';ctx.beginPath();ctx.moveTo(left,y);ctx.lineTo(w-right,y);ctx.stroke();ctx.fillStyle='#8791a2';ctx.fillText(Math.round(max*(4-i)/4),left-10,y+4)}if(!data.length)return;const ticks=Math.min(6,data.length);ctx.textAlign='center';for(let i=0;i<ticks;i++){const idx=Math.round(i*(data.length-1)/Math.max(1,ticks-1)),x=left+cw*idx/Math.max(1,data.length-1);ctx.fillText(data[idx].date.slice(5).replace('-','/'),x,h-10)}for(const [key,color] of [['instagram','#e83c91'],['tiktok','#14bdc6']]){ctx.beginPath();data.forEach((r,i)=>{const x=left+cw*i/Math.max(1,data.length-1),y=top+ch*(1-(r[key]||0)/max);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.strokeStyle=color;ctx.lineWidth=2.8;ctx.lineJoin='round';ctx.stroke()}}document.querySelectorAll('[data-days]').forEach(b=>b.addEventListener('click',()=>{selected=+b.dataset.days;document.querySelectorAll('[data-days]').forEach(x=>x.classList.toggle('active',x===b));render()}));addEventListener('resize',()=>render());fetch('./data.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('まだGA4データが取得されていません');return r.json()}).then(j=>{if(!Array.isArray(j.days))throw Error('データ形式が正しくありません');records=j.days;$('status').textContent='最終更新: '+(j.updatedAt?new Date(j.updatedAt).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'}):'不明');render()}).catch(e=>{$('status').textContent='GA4接続待ち：'+e.message;$('status').classList.add('error');render()});
</script></body></html>
